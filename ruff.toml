line-length = 100
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

ignore = [
    "E501", # line too long — formatter handles this
    "I001", # I hate this
    "B905", # makes no sense
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
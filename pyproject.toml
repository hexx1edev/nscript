[project]
name = "nscript"
version = "0.1.0"
description = "Small C-like compiled programming language"
readme = "README.md"
authors = [
    { name = "hexx1e" }
]
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "llvmlite>=0.49.0",
]

[project.scripts]
nscript = "nscript:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
